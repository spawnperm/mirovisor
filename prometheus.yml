global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - 'alerts.yml'

scrape_configs:
  - job_name: 'mirovisor-portal'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['portal:3000']
        labels:
          environment: 'production'
          service: 'portal-gateway'

  - job_name: 'nats-jetstream'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['nats:8222']
        labels:
          environment: 'production'
          service: 'telemetry-broker'
